# Move this file to .github/workflows after migration and replace each nested -S path with: -S .
name: Mesh Sculpt CI template
on: [push, pull_request]
jobs:
  linux:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { compiler: g++, type: Debug, werror: ON }
          - { compiler: clang++, type: Release, werror: OFF }
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libgl1-mesa-dev xorg-dev
      - run: cmake -S standalone/mesh-sculpt -B build/mesh-sculpt -DCMAKE_CXX_COMPILER=${{ matrix.compiler }} -DCMAKE_BUILD_TYPE=${{ matrix.type }} -DBUILD_TESTING=ON -DMESH_SCULPT_WARNINGS_AS_ERRORS=${{ matrix.werror }}
      - run: cmake --build build/mesh-sculpt --parallel
      - run: ctest --test-dir build/mesh-sculpt --output-on-failure
      - run: python3 standalone/mesh-sculpt/scripts/check_standalone_independence.py
      - run: python3 standalone/mesh-sculpt/scripts/verify_install.py build/mesh-sculpt --config ${{ matrix.type }}
      - run: python3 standalone/mesh-sculpt/scripts/verify_package.py build/mesh-sculpt --config ${{ matrix.type }}
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S standalone/mesh-sculpt -B build/mesh-sculpt -DBUILD_TESTING=ON -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build/mesh-sculpt --config Release --parallel
      - run: ctest --test-dir build/mesh-sculpt -C Release --output-on-failure
      - run: python standalone/mesh-sculpt/scripts/check_standalone_independence.py
      - run: python standalone/mesh-sculpt/scripts/verify_install.py build/mesh-sculpt --config Release
      - run: python standalone/mesh-sculpt/scripts/verify_package.py build/mesh-sculpt --config Release
